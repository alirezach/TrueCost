name: Release

# Manual-only release: triggered from GitHub Actions tab ("Run workflow" button).
# 1) Picks the version bump level (patch/minor/major) or keeps manifest.json as-is,
#    then bumps manifest.json and commits it back to the default branch.
# 2) Builds a Chrome-ready .zip (and .crx when the CHROME_KEY secret is configured).
# 3) Publishes a GitHub Release whose notes are your optional input plus an
#    auto-generated changelog of everything merged since the previous release.
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'سطح بالارفتن نسخه — آخرین نسخهٔ فعلی در manifest.json خوانده می‌شود و یک پله بالا می‌رود'
        required: true
        type: choice
        options:
          - patch (مثلاً 3.4.1 → 3.4.2 — رفع باگ/تغییرات کوچک)
          - minor (مثلاً 3.4.1 → 3.5.0 — قابلیت جدید)
          - major (مثلاً 3.4.1 → 4.0.0 — تغییر سازگارشکننده)
          - current (بدون بالابردن — از همان نسخهٔ موجود در manifest.json استفاده کن)
        default: 'patch (مثلاً 3.4.1 → 3.4.2 — رفع باگ/تغییرات کوچک)'
      release_notes:
        description: 'یادداشت دلخوه برای این نسخه (اختیاری — اگر خالی بماند، توضیحات فقط از کامیت‌ها ساخته می‌شود)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # secrets is not readable inside step `if:` — expose it as a job-level env var instead.
    env:
      HAS_CHROME_KEY: ${{ secrets.CHROME_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed to diff against the previous release tag

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Bump version in manifest.json and commit it back
        id: version
        run: |
          BUMP="${{ github.event.inputs.version_bump }}"
          CURRENT=$(node -p "require('./manifest.json').version")
          if [[ "$BUMP" == current* ]]; then
            NEW="$CURRENT"
          else
            LEVEL=$(echo "$BUMP" | cut -d' ' -f1)
            NEW=$(node -e "const v='$CURRENT'.split('.').map(Number); if('$LEVEL'==='patch') v[2]++; else if('$LEVEL'==='minor') { v[1]++; v[2]=0; } else if('$LEVEL'==='major') { v[0]++; v[1]=0; v[2]=0; } console.log(v.join('.'))")
            node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json','utf8')); m.version='$NEW'; fs.writeFileSync('manifest.json', JSON.stringify(m,null,2)+'\n')"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "chore: bump version to $NEW [skip ci]"
            git push
          fi
          echo "Old version: $CURRENT, new version: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Run checks
        run: |
          npm ci
          npm test

      - name: Build Chrome zip package
        run: |
          mkdir -p dist
          zip -r "dist/TrueCost-${{ steps.version.outputs.version }}.zip" \
            manifest.json popup.html options.html assets/ data/ \
            -x "*/node_modules/*" "*/.DS_Store"

      - name: Build Chrome crx package (only when the CHROME_KEY secret is set)
        if: ${{ env.HAS_CHROME_KEY != '' }}
        run: |
          printf '%s' "$HAS_CHROME_KEY" > key.pem
          npx --yes crx pack --zip-output "dist/TrueCost-${{ steps.version.outputs.version }}.zip" -p key.pem -o "dist/TrueCost-${{ steps.version.outputs.version }}.crx" || true

      - name: Build release notes from commits since the previous release
        id: notes
        run: |
          PrevTag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          {
            echo "NOTES<<EOF"
            if [ -n "${{ github.event.inputs.release_notes }}" ]; then
              echo "${{ github.event.inputs.release_notes }}"
              echo ""
            fi
            if [ -n "$PrevTag" ]; then
              echo "## تغییرات نسبت به نسخهٔ قبلی ($PrevTag)"
              git log "$PrevTag"..HEAD --pretty=format:"- %s" --no-merges
            else
              echo "## تغییرات"
              git log --pretty=format:"- %s" --no-merges -n 20
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: True Cost v${{ steps.version.outputs.version }}
          body: |
            ${{ steps.notes.outputs.NOTES }}

            ---
            **دانلود:** فایل `TrueCost-${{ steps.version.outputs.version }}.zip` را از بخش Assets بگیرید، از حالت فشرده خارج کنید و مراحل نصب را در README دنبال کنید.
          files: dist/*
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          make_latest: true
