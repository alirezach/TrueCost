name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version increment (read current version from manifest.json)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - current
        default: patch
      release_notes:
        description: 'Optional release notes; commit history is generated automatically'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: truecost-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CHROME_KEY: ${{ secrets.CHROME_KEY }}
      USER_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Resolve version (do not publish duplicate tags)
        id: version
        env:
          BUMP: ${{ inputs.version_bump }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./manifest.json').version")
          case "$BUMP" in
            current) NEW="$CURRENT" ;;
            patch|minor|major)
              NEW=$(node -e 'const p=process.argv[1].split(".").map(Number); if(p.length!==3||p.some(x=>!Number.isInteger(x))) process.exit(1); switch(process.argv[2]){case "patch":p[2]++;break;case "minor":p[1]++;p[2]=0;break;case "major":p[0]++;p[1]=0;p[2]=0} console.log(p.join("."))' "$CURRENT" "$BUMP")
              ;;
            *) echo "Invalid version bump" >&2; exit 1 ;;
          esac
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "Tag v$NEW already exists; choose another version." >&2
            exit 1
          fi
          echo "Current version: $CURRENT; release version: $NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: |
          npm ci
          npm test

      - name: Stage only extension runtime files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p package dist
          cp manifest.json popup.html options.html package/
          cp -R assets data package/
          node - <<'NODE'
          const fs = require('fs');
          const file = 'package/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          manifest.version = process.env.VERSION;
          for (const icons of [manifest.icons, manifest.action?.default_icon]) {
            if (!icons) continue;
            if (typeof icons === 'string') throw new Error('Expected size-keyed icon paths');
            for (const size of Object.keys(icons)) {
              if (typeof icons[size] !== 'string') throw new Error(`Invalid icon path for ${size}`);
              icons[size] = icons[size].replace(/^\.\//, '');
            }
          }
          fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          test -f package/manifest.json
          test -f package/assets/script/content.js
          test -f package/data/sites.csv
          if find package -type f | grep -E '/(\.git|\.github|node_modules|tests|scripts)/|\.(md|markdown)$|/(package(-lock)?\.json|\.gitignore)$'; then
            echo "Unexpected non-runtime file in package" >&2
            exit 1
          fi
          (cd package && zip -q -r "../dist/TrueCost-${VERSION}-chrome.zip" .)
          unzip -tqq "dist/TrueCost-${VERSION}-chrome.zip"
          if unzip -Z -1 "dist/TrueCost-${VERSION}-chrome.zip" | grep -E '(^|/)(\.git|\.github|node_modules|tests|scripts)(/|$)|\.(md|markdown)$|(^|/)(package(-lock)?\.json|\.gitignore)$'; then
            echo "Unexpected non-runtime file in ZIP" >&2
            exit 1
          fi

      - name: Validate the uploaded ZIP's manifest and icons
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { execFileSync } = require('child_process');
          const assert = require('assert/strict');
          const zip = `dist/TrueCost-${process.env.VERSION}-chrome.zip`;
          const entries = new Set(execFileSync('unzip', ['-Z', '-1', zip], { encoding: 'utf8' }).trim().split('\n'));
          assert(entries.has('manifest.json'), 'manifest.json must be at the ZIP root');
          const fromZip = name => execFileSync('unzip', ['-p', zip, name]);
          const manifest = JSON.parse(fromZip('manifest.json').toString('utf8'));
          assert.equal(manifest.version, process.env.VERSION);
          for (const name of ['popup.html', 'options.html', 'assets/script/content.js', 'data/sites.csv']) {
            assert(entries.has(name), `Missing runtime file in ZIP: ${name}`);
          }
          for (const [group, icons] of Object.entries({ icons: manifest.icons, action: manifest.action?.default_icon })) {
            assert(icons && typeof icons === 'object' && !Array.isArray(icons), `Missing ${group} icon map`);
            for (const [size, name] of Object.entries(icons)) {
              assert(typeof name === 'string' && !name.startsWith('./') && !name.startsWith('/') && !name.includes('..'), `Invalid ${group} icon path: ${name}`);
              assert(entries.has(name), `Missing ${group} icon in ZIP: ${name}`);
              const png = fromZip(name);
              assert(png.subarray(0, 8).equals(Buffer.from('89504e470d0a1a0a', 'hex')), `Not a PNG: ${name}`);
              assert.equal(png.readUInt32BE(16), Number(size), `Wrong icon width: ${name}`);
              assert.equal(png.readUInt32BE(20), Number(size), `Wrong icon height: ${name}`);
              console.log(`Verified ${group} icon ${size}: ${name}`);
            }
          }
          for (const size of ['16', '32', '48', '128']) {
            assert(manifest.icons[size] && manifest.action.default_icon[size], `Missing required icon size: ${size}`);
          }
          NODE
          echo 'Verified ZIP entries:'
          unzip -Z -1 "dist/TrueCost-${VERSION}-chrome.zip"

      - name: Build optional CRX from the same clean directory
        if: ${{ env.CHROME_KEY != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$CHROME_KEY" > "$RUNNER_TEMP/truecost-key.pem"
          chmod 600 "$RUNNER_TEMP/truecost-key.pem"
          trap 'rm -f "$RUNNER_TEMP/truecost-key.pem"' EXIT
          npx --yes crx pack package -p "$RUNNER_TEMP/truecost-key.pem" -o "dist/TrueCost-${VERSION}-chrome.crx"
          test -s "dist/TrueCost-${VERSION}-chrome.crx"

      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 2>/dev/null || true)
          notes_file=$(mktemp)
          if [ -n "$USER_NOTES" ]; then
            printf '%s\n\n' "$USER_NOTES" > "$notes_file"
          fi
          if [ -n "$prev" ]; then
            printf '## Changes since %s\n' "$prev" >> "$notes_file"
            git log "$prev..HEAD" --pretty=format:'- %s%n' --no-merges >> "$notes_file"
          else
            printf '## Recent changes\n' >> "$notes_file"
            git log -n 20 --pretty=format:'- %s%n' --no-merges >> "$notes_file"
          fi
          {
            echo "notes<<TC_NOTES_EOF"
            cat "$notes_file"
            echo "TC_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f "$notes_file"

      - name: Commit version bump after successful build
        if: ${{ inputs.version_bump != 'current' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = process.env.VERSION;
          fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add manifest.json
          git commit -m "chore: bump version to ${VERSION} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: True Cost v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          body: |
            ${{ steps.notes.outputs.notes }}

            ---
            Download `TrueCost-${{ steps.version.outputs.version }}-chrome.zip` from Assets to install or submit to the Chrome Web Store. Do not use GitHub's automatically generated Source code archives as extension packages.
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: true
